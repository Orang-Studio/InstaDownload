name: Build iOS

on:
  push:
    branches: [ ios ]
    paths:
      - 'InstaDownloadiOS/**'
      - '.github/workflows/build-ios.yml'
    tags: [ 'v*-ios' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    outputs:
      ipa_name: ${{ steps.prepare.outputs.ipa_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build unsigned ipa
        working-directory: InstaDownloadiOS
        run: ./Scripts/build-ipa.sh

      - name: Prepare ipa asset
        id: prepare
        working-directory: InstaDownloadiOS
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%-ios}"
          else
            VERSION="${GITHUB_SHA:0:7}"
          fi
          IPA_NAME="InstaDownload-${VERSION}-ios.ipa"
          cp build/InstaDownload.ipa "../$IPA_NAME"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.ipa_name }}
          path: ${{ steps.prepare.outputs.ipa_name }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ipa artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.ipa
          name: InstaDownload ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
